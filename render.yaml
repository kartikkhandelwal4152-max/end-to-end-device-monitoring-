services:
  - type: web
    name: sentinel-monitoring
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: SENTINEL_DATA
        value: /app/data
      - key: SENTINEL_ADMIN_PASSWORD
        value: Admin@Sentinel2026!
      - key: SENTINEL_DEFAULT_DEVICE
        value: FRIEND-MAC
      - key: SENTINEL_DEFAULT_TOKEN
        generateValue: true
      - key: SENTINEL_BEHIND_PROXY
        value: "true"
